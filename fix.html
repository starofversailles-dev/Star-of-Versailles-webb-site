<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star of Versailles</title>
<style>html,body{margin:0;background:#fffaf0;color:#17130f;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.08em}</style>
</head>
<body>
<div id="loading">STAR OF VERSAILLES</div>
<script>
(async()=>{
  try{
    const response=await fetch('/index.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load site');
    let html=await response.text();
    const darkHero='background-image:linear-gradient(90deg,rgba(18,13,9,.72) 0%,rgba(18,13,9,.42) 37%,rgba(18,13,9,.05) 67%),url(';
    if(!html.includes(darkHero)) throw new Error('Hero overlay not found');
    html=html.replace(darkHero,'background-image:url(');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    location.replace('/index.html');
  }
})();
</script>
</body>
</html>

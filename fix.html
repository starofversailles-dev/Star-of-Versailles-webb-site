<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star of Versailles</title>
<style>html,body{margin:0;background:#17130f;color:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.08em}</style>
</head>
<body>
<div id="loading">STAR OF VERSAILLES</div>
<script>
(async()=>{
  try{
    const response=await fetch('/index.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load site');
    let html=await response.text();
    const oldBackground=html.match(/data:image\/webp;base64,[A-Za-z0-9+/=]+/);
    if(!oldBackground) throw new Error('Background not found');
    const cleanBackground='https://upload.wikimedia.org/wikipedia/commons/c/c0/Palace_of_Versailles_Hall_of_Mirrors_%2828354739025%29.jpg';
    html=html.split(oldBackground[0]).join(cleanBackground);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    location.replace('/index.html');
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star of Versailles</title>
<style>html,body{margin:0;background:#fffaf0;color:#17130f;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.08em}</style>
</head>
<body>
<div id="loading">STAR OF VERSAILLES</div>
<script>
(async()=>{
  try{
    const response=await fetch('/index.html?v=landscape-fix-2',{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load site');
    let html=await response.text();

    const landscapeFix=`<style id="landscape-hero-fix">
    @media (orientation: landscape), (min-aspect-ratio: 1/1) {
      .hero {
        background-image:
          linear-gradient(90deg,rgba(18,13,9,.76) 0%,rgba(18,13,9,.43) 38%,rgba(18,13,9,.08) 72%),
          url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Palace_of_Versailles_Hall_of_Mirrors_%2828354739025%29.jpg/1280px-Palace_of_Versailles_Hall_of_Mirrors_%2828354739025%29.jpg') !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
      }
    }
    </style>`;

    html=html.replace('</head>',landscapeFix+'</head>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    location.replace('/index.html');
  }
})();
</script>
</body>
</html>
